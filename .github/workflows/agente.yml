name: Agente Dots Inteligente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agente:
    runs-on: ubuntu-latest
    container: gradle:8.7-jdk17
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Android SDK
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl git python3
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses > /dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar projeto
        run: |
          mkdir -p app/src/main/java/com/quickprice/app app/src/main/res/values
          [ -f app-build.gradle ] && mv app-build.gradle app/build.gradle
          for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/quickprice/app/; done
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          git config --global user.email "agente@consultapreco.app"
          git config --global user.name "Agente Dots"

      - name: CICLO 1 - Compilar
        id: ciclo1
        run: gradle assembleDebug --no-daemon 2>&1 | tee /tmp/erro_gradle.txt || true

      - name: Agente corrige erros
        if: steps.ciclo1.outcome == 'failure'
        run: |
          cat > /tmp/corretor.py << 'PYEOF'
          import re, os
          
          with open('/tmp/erro_gradle.txt', 'r') as f:
              erro = f.read()
          
          corrigiu = False
          for root, dirs, files in os.walk('app/src/main/java'):
              for file in files:
                  if file.endswith('.kt'):
                      caminho = os.path.join(root, file)
                      with open(caminho, 'r') as f:
                          codigo = f.read()
                      corrigido = codigo
                      
                      # Adiciona imports faltantes
                      if 'Glide' in erro and 'import com.bumptech.glide.Glide' not in corrigido:
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              corrigido = corrigido.replace(imports[-1], imports[-1] + 'import com.bumptech.glide.Glide\n')
                      
                      if 'JSONObject' in erro and 'import org.json.JSONObject' not in corrigido:
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              corrigido = corrigido.replace(imports[-1], imports[-1] + 'import org.json.JSONObject\n')
                      
                      if 'JSONArray' in erro and 'import org.json.JSONArray' not in corrigido:
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              corrigido = corrigido.replace(imports[-1], imports[-1] + 'import org.json.JSONArray\n')
                      
                      if corrigido != codigo:
                          with open(caminho, 'w') as f:
                              f.write(corrigido)
                          print(f"✅ Corrigido: {file}")
                          corrigiu = True
          
          if not corrigiu:
              print("❌ Não consegui corrigir automaticamente")
          PYEOF
          python3 /tmp/corretor.py

      - name: CICLO 2 - Compilar de novo
        id: ciclo2
        if: steps.ciclo1.outcome == 'failure'
        run: gradle assembleDebug --no-daemon 2>&1 | tee /tmp/erro_gradle.txt || true

      - name: Commit das correções
        if: success() && steps.ciclo1.outcome == 'failure'
        run: |
          git add -A
          git commit -m "🤖 Agente Dots corrigiu erros automaticamente" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true

      - name: Enviar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-agente
          path: app/build/outputs/apk/debug/app-debug.apk
