name: Agente Dots Inteligente

on:
  workflow_dispatch:
    inputs:
      telegram_token:
        description: 'Token do Telegram (opcional, pra receber aviso)'
        required: false
      telegram_chat_id:
        description: 'Seu Chat ID do Telegram (opcional)'
        required: false

permissions:
  contents: write

jobs:
  agente:
    runs-on: ubuntu-latest
    container: gradle:8.7-jdk17
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Android SDK
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl git python3
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses > /dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar projeto
        run: |
          mkdir -p app/src/main/java/com/quickprice/app app/src/main/res/values
          [ -f app-build.gradle ] && mv app-build.gradle app/build.gradle
          for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/quickprice/app/; done
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          git config user.email "agente@consultapreco.app"
          git config user.name "Agente Dots 🤖"

      - name: Criar corretor inteligente
        run: |
          cat > /tmp/corretor.py << 'PYEOF'
          import re
          import sys
          import os

          def ler_erro(arquivo):
              try:
                  with open(arquivo, 'r') as f:
                      return f.read()
              except:
                  return ""

          def corrigir_kotlin(arquivo, erro):
              """Corrige erros comuns em Kotlin"""
              try:
                  with open(arquivo, 'r') as f:
                      codigo = f.read()
                  
                  corrigido = codigo
                  
                  # Se faltar import do Glide
                  if 'unresolved reference: Glide' in erro or 'glide' in erro.lower():
                      if 'import com.bumptech.glide.Glide' not in corrigido:
                          # Adiciona apos o ultimo import
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              ultimo_import = imports[-1]
                              corrigido = corrigido.replace(ultimo_import, ultimo_import + 'import com.bumptech.glide.Glide\n')
                          else:
                              # Adiciona apos package
                              corrigido = re.sub(r'(package .*\n)', r'\1import com.bumptech.glide.Glide\n', codigo)
                  
                  # Se faltar import do JSONObject
                  if 'unresolved reference: JSONObject' in erro:
                      if 'import org.json.JSONObject' not in corrigido:
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              ultimo_import = imports[-1]
                              corrigido = corrigido.replace(ultimo_import, ultimo_import + 'import org.json.JSONObject\n')
                  
                  # Se faltar import do JSONArray
                  if 'unresolved reference: JSONArray' in erro:
                      if 'import org.json.JSONArray' not in corrigido:
                          imports = re.findall(r'import .*\n', corrigido)
                          if imports:
                              ultimo_import = imports[-1]
                              corrigido = corrigido.replace(ultimo_import, ultimo_import + 'import org.json.JSONArray\n')
                  
                  # Corrige TYPE_ para FORMAT_ no ScannerActivity
                  if 'TYPE_EAN' in erro or 'TYPE_CODE' in erro or 'TYPE_UPC' in erro:
                      corrigido = corrigido.replace('TYPE_EAN_13', 'FORMAT_EAN_13')
                      corrigido = corrigido.replace('TYPE_EAN_8', 'FORMAT_EAN_8')
                      corrigido = corrigido.replace('TYPE_UPC_A', 'FORMAT_UPC_A')
                      corrigido = corrigido.replace('TYPE_UPC_E', 'FORMAT_UPC_E')
                      corrigido = corrigido.replace('TYPE_CODE_128', 'FORMAT_CODE_128')
                      corrigido = corrigido.replace('TYPE_CODE_39', 'FORMAT_CODE_39')
                  
                  # Corrige setSurfaceProvider
                  if 'surfaceProvider' in erro and 'setSurfaceProvider' not in erro:
                      corrigido = corrigido.replace('.surfaceProvider =', '.setSurfaceProvider(')
                      # Fecha parentese se necessario
                      linhas = corrigido.split('\n')
                      for i, linha in enumerate(linhas):
                          if 'setSurfaceProvider(' in linha and not linha.rstrip().endswith(')'):
                              linhas[i] = linha.rstrip() + ')'
                      corrigido = '\n'.join(linhas)
                  
                  if corrigido != codigo:
                      with open(arquivo, 'w') as f:
                          f.write(corrigido)
                      return True
                  
                  return False
              except Exception as e:
                  print(f"Erro ao corrigir: {e}")
                  return False

          # Lê o erro do Gradle
          erro = ler_erro('/tmp/erro_gradle.txt')
          
          # Descobre qual arquivo Kotlin tem o erro
          arquivos_kt = []
          for root, dirs, files in os.walk('app/src/main/java'):
              for file in files:
                  if file.endswith('.kt'):
                      arquivos_kt.append(os.path.join(root, file))
          
          corrigiu_algo = False
          for arquivo in arquivos_kt:
              nome_arquivo = os.path.basename(arquivo)
              # Se o erro menciona o nome do arquivo
              if nome_arquivo in erro:
                  print(f"Agente corrigindo {nome_arquivo}...")
                  if corrigir_kotlin(arquivo, erro):
                      corrigiu_algo = True
                      print(f"✅ {nome_arquivo} corrigido!")
          
          # Se não mencionou arquivo específico, tenta corrigir todos
          if not corrigiu_algo:
              print("Agente analisando todos os arquivos...")
              for arquivo in arquivos_kt:
                  if corrigir_kotlin(arquivo, erro):
                      corrigiu_algo = True
                      print(f"✅ {os.path.basename(arquivo)} corrigido!")
          
          if corrigiu_algo:
              print("\n🎉 Agente conseguiu corrigir!")
          else:
              print("\n❌ Agente não conseguiu corrigir automaticamente")
              print("Erro:", erro[:500])
          
          sys.exit(0 if corrigiu_algo else 1)
          PYEOF

      - name: CICLO 1 - Primeira compilacao
        id: ciclo1
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/erro_gradle.txt || true

      - name: Agente analisa e corrige
        if: steps.ciclo1.outcome == 'failure'
        run: |
          echo "🤖 Agente Dots analisando erro..."
          python3 /tmp/corretor.py

      - name: CICLO 2 - Compila de novo
        id: ciclo2
        if: steps.ciclo1.outcome == 'failure'
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/erro_gradle.txt || true

      - name: Agente tenta de novo (se ainda falhou)
        if: steps.ciclo1.outcome == 'failure' && steps.ciclo2.outcome == 'failure'
        run: |
          echo "🤖 Agente Dots - Segunda tentativa..."
          python3 /tmp/corretor.py

      - name: CICLO 3 - Ultima tentativa
        id: ciclo3
        if: steps.ciclo1.outcome == 'failure' && steps.ciclo2.outcome == 'failure'
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/erro_gradle.txt || true

      - name: Testar login no site (simulado)
        run: |
          echo "==== AGENTE TESTANDO LOGIN ===="
          # Aqui poderia testar a URL de login
          curl -s -I https://rmarket.cartazfacil.pro/unitario.php 2>/dev/null | head -5
          echo "Site acessível!"

      - name: Notificar via Telegram
        if: always()
        run: |
          if [ -n "${{ inputs.telegram_token }}" ] && [ -n "${{ inputs.telegram_chat_id }}" ]; then
            STATUS="❌ FALHOU"
            [ -f app/build/outputs/apk/debug/app-debug.apk ] && STATUS="✅ SUCESSO"
            MENSAGEM="🤖 Agente Dots finalizou!\n\nStatus: $STATUS\nTempo: $((SECONDS/60)) min\n\nRepositório: badalipe/consulta-preco"
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.telegram_token }}/sendMessage" \
              -d "chat_id=${{ inputs.telegram_chat_id }}" \
              -d "text=$MENSAGEM" > /dev/null
          fi

      - name: Commit das correcoes do agente
        if: success() && steps.ciclo1.outcome == 'failure'
        run: |
          git add -A
          git commit -m "🤖 Agente Dots corrigiu erros automaticamente" || true
          git push

      - name: Enviar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-final
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            /tmp/erro_gradle.txt
