
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: gradle:8.7-jdk17
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Reorganizar arquivos (upload tudo-junto pelo celular)
        run: |
          mkdir -p app/src/main/java/com/quickprice/app app/src/main/res/layout app/src/main/res/values
          [ -f app-build.gradle ] && mv app-build.gradle app/build.gradle
          for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/quickprice/app/; done
          for f in activity_*.xml; do [ -f "$f" ] && mv "$f" app/src/main/res/layout/; done
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          echo "--- estrutura final ---"
          find . -type f -not -path "./.git/*" | sort

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: consulta-preco-apk
          path: app/build/outputs/apk/debug/app-debug.apk
