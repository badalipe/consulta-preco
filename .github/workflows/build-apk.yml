name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: gradle:8.7-jdk17
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Android SDK
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses > /dev/null || true
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk "platforms;android-34" "build-tools;34.0.0"

      - name: Reorganizar arquivos
        run: |
          mkdir -p app/src/main/java/com/quickprice/app app/src/main/res/values
          [ -f app-build.gradle ] && mv app-build.gradle app/build.gradle
          for f in *.kt; do [ -f "$f" ] && mv "$f" app/src/main/java/com/quickprice/app/; done
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/

      - name: Diagnostico profundo
        run: |
          echo "===== app/build.gradle ====="
          cat app/build.gradle
          echo "===== deps camera/mlkit no classpath ====="
          gradle :app:dependencies --configuration debugCompileClasspath --no-daemon > /tmp/deps.txt 2>&1 || true
          grep -Ei "camera|mlkit|barcode" /tmp/deps.txt || echo ">>> NADA NO CLASSPATH <<<"
          echo "===== Abrindo a biblioteca ML Kit ====="
          AAR=$(find / -name "barcode-scanning-*.aar" 2>/dev/null | head -1)
          echo "AAR encontrado: $AAR"
          if [ -n "$AAR" ]; then
            unzip -p "$AAR" classes.jar > /tmp/bc.jar 2>/dev/null
            javap -classpath /tmp/bc.jar com.google.mlkit.vision.barcode.common.Barcode 2>&1 | grep -E "TYPE_|getValueType" | head -12
          fi
          echo "===== Abrindo o camera-core ====="
          CAAR=$(find / -name "camera-core-*.aar" 2>/dev/null | head -1)
          echo "AAR: $CAAR"
          if [ -n "$CAAR" ]; then
            unzip -p "$CAAR" classes.jar > /tmp/cc.jar 2>/dev/null
            javap -classpath /tmp/cc.jar androidx.camera.core.Preview 2>&1 | grep -E "SurfaceProvider" | head
          fi

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Enviar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            /tmp/deps.txt
