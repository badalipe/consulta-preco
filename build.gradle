buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // ← ADICIONA ESTA LINHA (para o Glide)
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }  // ← E ESTA AQUI TAMBÉM
    }
}
task clean(type: Delete) { delete rootProject.buildDir }
