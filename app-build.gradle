plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def quoteForBuildConfig = { value ->
    def escaped = value.toString()
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\n', '\\n')
        .replace('\r', '\\r')
    return '"' + escaped + '"'
}

def cartazUsername = providers.gradleProperty('cartazUsername').orElse('').get()
def cartazPassword = providers.gradleProperty('cartazPassword').orElse('').get()
def appFirstPassword = providers.gradleProperty('appFirstPassword').orElse('').get()
def appFirstPasswordHash = appFirstPassword.isEmpty() ? '' :
    java.security.MessageDigest.getInstance('SHA-256')
        .digest(appFirstPassword.getBytes('UTF-8'))
        .collect { String.format('%02x', it & 0xff) }
        .join()

android {
    namespace 'com.quickprice.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quickprice.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "CARTAZ_BASE_URL", quoteForBuildConfig("https://rmarket.cartazfacil.pro")
        buildConfigField "String", "CARTAZ_USERNAME", quoteForBuildConfig(cartazUsername)
        buildConfigField "String", "CARTAZ_PASSWORD", quoteForBuildConfig(cartazPassword)
        buildConfigField "String", "APP_FIRST_PASSWORD_HASH", quoteForBuildConfig(appFirstPasswordHash)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // CameraX + ML Kit
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
